  term: PENA, RFO[Author] AND PENA, RF[Author]
  plugin: sources.py
  file: sources_pena.yaml
  type: paper
  description: "Resonance in neurons with hyperpolarization-activated current (Ih)\
    \ is determined by the biophysical properties of Ih, specifically the derivative\
    \ conductance (GDer) and current activation kinetics (\u03C4h). The presence and\
    \ frequency of resonance are controlled by GDer and \u03C4h, and their increase\
    \ leads to enhanced resonance. Voltage dependence of GDer makes resonance voltage-dependent.\
    \ These findings provide insights into predicting and explaining resonance properties\
    \ in neurons with Ih."
