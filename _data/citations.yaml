  plugin: sources.py
  file: sources_pena.yaml
  type: paper
  description: The persistent sodium current (INaP) prolongs EPSP decay by increasing
    the membrane time constant. In the zero slope conductance region, non-decaying
    EPSPs are observed in CA1 hippocampal pyramidal cells. These EPSPs and delayed
    spikes are abolished by Na+ channel block and occur in response to small amplitude
    aEPSCs. This suggests that INaP enhances synaptic integration in distal dendritic
    regions.
