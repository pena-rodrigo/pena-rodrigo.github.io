  term: PENA, RFO[Author] AND PENA, RF[Author]
  plugin: sources.py
  file: sources_pena.yaml
  type: paper
  description: The cerebral cortex exhibits spontaneous neural activity without external
    input. Using computer simulations, we studied the mechanisms behind this activity
    in hierarchical modular networks. Our models replicated experimental observations
    of irregular firing and oscillatory patterns. The activity duration depended on
    initial conditions and network characteristics, highlighting the impact of both
    structure and neuron types on cortical activity.
